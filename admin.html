<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HH Store Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#101828}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:28px;font-weight:900}.logo span{color:#168bff}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.login{max-width:420px;margin:12vh auto}.input,select,textarea{width:100%;padding:11px;border:1px solid #d7dde5;border-radius:8px;font:inherit;margin:5px 0 10px}.btn{border:0;background:#07101b;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.blue{background:#168bff}.green{background:#20b85a}.red{background:#dc2626}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.muted{color:#667085;font-size:12px}.status{padding:5px;border-radius:7px}.actions{display:flex;gap:6px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.order-items{white-space:pre-line}.msg{padding:10px;border-radius:8px;background:#eef7ff;margin-bottom:10px}@media(max-width:800px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">HH <span>STORE</span> <small style="font-size:13px">ADMIN</small></div><a href="/">Mağazaya qayıt</a></div><div id="login" class="panel login"><h2>Admin giriş</h2><input id="pass" class="input" type="password" placeholder="Admin şifrəsi"><button class="btn blue" onclick="login()">Daxil ol</button><p class="muted">Şifrə .env faylındakı ADMIN_PASSWORD dəyəridir.</p><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="panel"><div class="top"><h2>Sifarişlər</h2><button class="btn" onclick="loadAll()">Yenilə</button></div><div id="orders"></div></div><div class="panel"><div class="top"><h2>Məhsul və stok idarəsi</h2><button class="btn blue" onclick="showAdd()">+ Məhsul əlavə et</button></div><div id="products"></div></div></div></div>
<script>let token=localStorage.getItem('hh_admin_token')||'';const api=async(u,o={})=>{o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{'x-admin-token':token}:{})};const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Xəta');return d};async function login(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pass').value})});token=d.token;localStorage.setItem('hh_admin_token',token);showApp();loadAll()}catch(e){document.getElementById('loginMsg').textContent=e.message}}function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}async function loadAll(){try{const[o,p]=await Promise.all([api('/api/admin/orders'),api('/api/admin/products')]);renderOrders(o);renderProducts(p)}catch(e){if(e.message.includes('Admin')){localStorage.removeItem('hh_admin_token');location.reload()}else alert(e.message)}}function renderOrders(rows){if(!rows.length){document.getElementById('orders').innerHTML='<p class="muted">Hələ sifariş yoxdur.</p>';return}document.getElementById('orders').innerHTML='<div class="tablewrap"><table class="table"><tr><th>#</th><th>Müştəri</th><th>Məhsullar</th><th>Cəmi</th><th>Status</th><th>Tarix</th><th></th></tr>'+rows.map(o=>`<tr><td>#${o.id}</td><td><b>${o.customer_name}</b><br>${o.customer_phone}<br>${o.address}</td><td class="order-items">${o.items.map(x=>`${x.name} × ${x.qty}`).join('\n')}</td><td>${Number(o.total).toLocaleString('az-AZ')} ₼</td><td><select onchange="status(${o.id},this.value)"><option value="new" ${o.status==='new'?'selected':''}>Yeni</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Təsdiqlənib</option><option value="shipped" ${o.status==='shipped'?'selected':''}>Göndərilib</option><option value="completed" ${o.status==='completed'?'selected':''}>Tamamlandı</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Ləğv</option></select></td><td>${o.created_at}</td><td><a href="https://wa.me/${o.customer_phone.replace(/\D/g,'')}" target="_blank">WhatsApp</a></td></tr>`).join('')+'</table></div>'}async function status(id,s){try{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:s})});loadAll()}catch(e){alert(e.message)}}function renderProducts(rows){document.getElementById('products').innerHTML='<div class="tablewrap"><table class="table"><tr><th>Şəkil</th><th>Məhsul</th><th>Qiymət</th><th>Stok</th><th>Brand</th><th></th></tr>'+rows.map(p=>`<tr><td><img src="${p.img}" width="65" height="65" style="object-fit:contain"></td><td><b>${p.name}</b><br><span class="muted">${p.spec}</span></td><td><input id="price${p.id}" class="input" style="width:110px" value="${p.price}"></td><td><input id="stock${p.id}" class="input" style="width:90px" type="number" value="${p.stock}"></td><td>${p.brand}</td><td class="actions"><button class="btn blue" onclick="saveProduct(${p.id})">Yadda saxla</button><button class="btn red" onclick="deactivate(${p.id})">Sil</button></td></tr>`).join('')+'</table></div>'}async function saveProduct(id){try{await api('/api/admin/products/'+id,{method:'PATCH',body:JSON.stringify({price:Number(document.getElementById('price'+id).value),stock:Number(document.getElementById('stock'+id).value)})});loadAll()}catch(e){alert(e.message)}}async function deactivate(id){if(!confirm('Məhsul mağazadan gizlədilsin?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});loadAll()}function showAdd(){document.getElementById('products').insertAdjacentHTML('afterbegin',`<div class="panel"><h3>Yeni məhsul</h3><div class="two"><input id="n" class="input" placeholder="Ad"><input id="pr" class="input" type="number" placeholder="Qiymət"><input id="im" class="input" placeholder="Şəkil URL"><input id="sp" class="input" placeholder="Qısa təsvir"><input id="br" class="input" placeholder="Brand: Apple / Samsung / Aksesuar"><input id="ca" class="input" placeholder="Kateqoriya: phone/audio/watch/laptop/usb"><input id="st" class="input" type="number" placeholder="Stok"><input id="ba" class="input" placeholder="Badge: Yeni"></div><button class="btn green" onclick="addProduct()">Əlavə et</button></div>`)}async function addProduct(){try{await api('/api/admin/products',{method:'POST',body:JSON.stringify({name:n.value,price:Number(pr.value),img:im.value,spec:sp.value,brand:br.value,cat:ca.value,stock:Number(st.value||0),badge:ba.value})});loadAll()}catch(e){alert(e.message)}}if(token){showApp();loadAll()}</script></body></html>
